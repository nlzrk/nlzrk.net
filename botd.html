<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bird of the day</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            height: 100%;
        }
        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .bird-widget {
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid white;
            padding: 20px;
            color: white;
            max-width: 400px;
            width: 100%;
        }
        .widget-header {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .bird-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .scientific-name {
            font-size: 12px;
            color: #aaa;
            font-style: italic;
            margin-bottom: 15px;
        }
        .bird-details {
            border-top: 1px solid #555;
            padding-top: 15px;
            margin-top: 15px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .detail-label {
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .detail-value {
            text-align: right;
        }
        .widget-footer {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #555;
            font-size: 10px;
            text-align: right;
        }
        .widget-footer a {
            color: white;
            text-decoration: none;
        }
        .widget-footer a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .home-button {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #555;
        }
        .home-button a {
            color: white;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .home-button a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .loading {
            text-align: center;
            color: #888;
        }
        .notable-badge {
            display: inline-block;
            background: white;
            color: black;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .bird-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 1px solid #555;
        }
        .no-image {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 12px;
            margin-bottom: 15px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    
    <div class="content">
        <div class="bird-widget">
            <div class="home-button">
                <a href="birds.html">← home</a>
            </div>
            
            <div class="widget-header">bird of the day</div>
            
            <div id="content" class="loading">loading...</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, cube;
        let targetRotationX = 0;
        let targetRotationY = 0;
        let mouseX = 0;
        let mouseY = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 1);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('scene-container').appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry(3, 3, 3);
            const textureLoader = new THREE.TextureLoader();
            const texture = textureLoader.load('images/steel.JPG');
            const material = new THREE.MeshBasicMaterial({ map: texture });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            camera.position.z = 5;

            document.addEventListener('mousemove', onDocumentMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2) / 100;
            mouseY = (event.clientY - window.innerHeight / 2) / 100;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            targetRotationY += (mouseX - targetRotationY) * 0.05;
            targetRotationX += (mouseY - targetRotationX) * 0.05;

            cube.rotation.y += 0.5 * (targetRotationY - cube.rotation.y);
            cube.rotation.x += 0.5 * (targetRotationX - cube.rotation.x);

            renderer.render(scene, camera);
        }

        init();
    </script>

    <script>
        const API_KEY = 'oaph6u3goa9s';
        
        async function loadBirdOfTheDay() {
            try {
                // Fetch notable observations from NSW
                const response = await fetch('https://api.ebird.org/v2/data/obs/AU-NSW/recent/notable?detail=full', {
                    headers: { 'X-eBirdApiToken': API_KEY }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }

                const observations = await response.json();
                
                if (observations.length === 0) {
                    // Fallback to regular recent observations
                    const fallbackResponse = await fetch('https://api.ebird.org/v2/data/obs/AU-NSW/recent?detail=full', {
                        headers: { 'X-eBirdApiToken': API_KEY }
                    });
                    const fallbackObs = await fallbackResponse.json();
                    await displayBird(fallbackObs[0], false);
                } else {
                    // Pick a deterministic "bird of the day" based on today's date
                    const today = new Date().toDateString();
                    const dayIndex = today.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
                    const birdIndex = dayIndex % observations.length;
                    await displayBird(observations[birdIndex], true);
                }
                
            } catch (error) {
                console.error('Error loading bird:', error);
                document.getElementById('content').innerHTML = '<div style="color: #888;">Unable to load bird data</div>';
            }
        }

        async function displayBird(bird, isNotable) {
            const date = new Date(bird.obsDt);
            const formattedDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            
            // Fetch image from Macaulay Library (eBird's media partner)
            let imageHtml = '<div class="no-image">NO IMAGE AVAILABLE</div>';
            let imageUrl = null;
            try {
                const mediaResponse = await fetch(`https://search.macaulaylibrary.org/api/v1/search?taxonCode=${bird.speciesCode}&mediaType=p&sort=rating_rank_desc&count=1`, {
                    headers: { 'X-eBirdApiToken': API_KEY }
                });
                
                if (mediaResponse.ok) {
                    const mediaData = await mediaResponse.json();
                    if (mediaData.results && mediaData.results.content && mediaData.results.content.length > 0) {
                        imageUrl = mediaData.results.content[0].mediaUrl;
                        imageHtml = `<img src="${imageUrl}" alt="${bird.comName}" class="bird-image">`;
                        
                        // Update cube texture with bird image
                        updateCubeTexture(imageUrl);
                    }
                }
            } catch (error) {
                console.error('Error loading image:', error);
            }
            
            const content = `
                ${isNotable ? '<div class="notable-badge">NOTABLE</div>' : ''}
                ${imageHtml}
                <div class="bird-name">${bird.comName}</div>
                <div class="scientific-name">${bird.sciName || ''}</div>
                
                <div class="bird-details">
                    <div class="detail-row">
                        <div class="detail-label">Location</div>
                        <div class="detail-value">${bird.locName}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Observed</div>
                        <div class="detail-value">${formattedDate}</div>
                    </div>
                    ${bird.howMany ? `
                    <div class="detail-row">
                        <div class="detail-label">Count</div>
                        <div class="detail-value">${bird.howMany}</div>
                    </div>
                    ` : ''}
                </div>
                
                <div class="widget-footer">
                    <a href="https://ebird.org/species/${bird.speciesCode}" target="_blank">view species info (ebird) →</a>
                </div>
            `;
            
            document.getElementById('content').innerHTML = content;
        }
        
        function updateCubeTexture(imageUrl) {
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(imageUrl, (texture) => {
                cube.material.map = texture;
                cube.material.needsUpdate = true;
            });
        }
        
        loadBirdOfTheDay();
    </script>
</body>
</html>
