<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ads</title>
    <link rel="icon" type="image/png" href="images/birb.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- paste your AdSense <script> tag here once approved -->

    <style>
        body, html {
            margin: 0; padding: 0;
            background: #000;
            font-family: 'JetBrains Mono', monospace;
            height: 100%;
        }
        #scene-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }
        #dim-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }
        #page {
            position: relative;
            z-index: 2;
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }
        .home-btn {
            display: inline-block;
            font-size: 12px;
            color: white;
            text-decoration: none;
            border: 1px solid #444;
            padding: 6px 12px;
            margin-bottom: 32px;
        }
        .home-btn:hover { background: rgba(255,255,255,0.08); }

        /* ad slot containers */
        .ad-slot {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid #222;
            margin-bottom: 24px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* placeholder shown before AdSense is active */
        .ad-placeholder {
            color: #333;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    <div id="dim-overlay"></div>

    <div id="page">
        <a class="home-btn" href="index.html">← home</a>

        <!-- ad slot 1 — replace inner div with your AdSense <ins> block -->
        <div class="ad-slot">
            <div class="ad-placeholder">advertisement</div>
        </div>

        <!-- ad slot 2 -->
        <div class="ad-slot">
            <div class="ad-placeholder">advertisement</div>
        </div>

        <!-- ad slot 3 -->
        <div class="ad-slot">
            <div class="ad-placeholder">advertisement</div>
        </div>

        <!-- ad slot 4 -->
        <div class="ad-slot">
            <div class="ad-placeholder">advertisement</div>
        </div>

        <!-- ad slot 5 -->
        <div class="ad-slot">
            <div class="ad-placeholder">advertisement</div>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.getElementById('scene-container').appendChild(renderer.domElement);

        const cube = new THREE.Mesh(
            new THREE.BoxGeometry(3, 3, 3),
            new THREE.MeshBasicMaterial({ map: new THREE.TextureLoader().load('images/steel.JPG') })
        );
        scene.add(cube);
        camera.position.z = 5;

        let tx = 0, ty = 0, mx = 0, my = 0;
        document.addEventListener('mousemove', e => {
            mx = (e.clientX - innerWidth / 2) / 100;
            my = (e.clientY - innerHeight / 2) / 100;
        });
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
        (function animate() {
            requestAnimationFrame(animate);
            ty += (mx - ty) * 0.05;
            tx += (my - tx) * 0.05;
            cube.rotation.y += 0.5 * (ty - cube.rotation.y);
            cube.rotation.x += 0.5 * (tx - cube.rotation.x);
            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
